name: tests

# on: [gollum]
on: [push, pull_request]

env:
  CAT_SHOW_LAST_ERROR: 1

jobs:
  cs-check:
    name: Coding style check
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for CRLF endings
        id: checkcrlf
        continue-on-error: true
        shell: php {0}
        run: |
          <?php

          # find out files with CRLF (\r\n) line endings
          $includes = [
              '.'
          ];
          $excludes = [
              '/.+\.ps1$/',
              '/.+\.bat$/',
              '/.+\.cmd$/',
          ];

          $files = [];
          foreach ($includes as $include) {
              $iteriter = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($include));
              foreach ($iteriter as $file) {
                  if ($file->isDir()) {
                      continue;
                  }
                  $files[] = $file->getPathname();
              }
          }
          foreach ($excludes as $exclude) {
              $files = array_filter($files, static function (string $file) use ($exclude): bool {
                  return !preg_match($exclude, $file);
              });
          }
          $haveCRLF = [];
          foreach ($files as $file) {
              $stat = stat($file);
              if ($stat['size'] >= 1024 * 1024) {
                  # skip large files
                  continue;
              }
              $content = file_get_contents($file);
              if (strpos($content, "\0")) {
                  # skip binary files
                  continue;
              }
              if (strpos($content, "\r") !== false) {
                  # if we have a file like
                  # "<?php\n$someData = \"somedata\r\n\";\n"
                  # this is not a CRLF ending file
                  # while
                  # "<?php\r\n$someData = \"somedata\r\n\";\r\n# this file is noeol"
                  # is a CRLF file
                  # so we need to find the last (CRLF or LF) in the file, if it is CRLF, then it is a CRLF file
                  if (strrpos($content, "\r\n") === strrpos($content, "\n") - 1) {
                      echo $file . PHP_EOL;
                      $haveCRLF[] = $file;
                  }
              }
          }
          if (count($haveCRLF) > 0) {
              echo "::error::CRLF line endings found" . PHP_EOL;
              exit(1);
          }


  win-tests:
    name: Test on ${{matrix.os}} build-type ${{matrix.build-type}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        os: [ "windows-latest", "windows-2025" ]
        build-type: [ "Debug", "Release" ]
        # build-type: [ "Debug" ]
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Fetch vcpkg versions from github
        run: |
          function fetchmeta {
            param ($Package)
            $retryCount = 0
            $req = $null
            while ($req -eq $null) {
              try {
                $req = Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/microsoft/vcpkg/master/ports/${Package}/CONTROL"
              } catch {
                try {
                  $req = Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/microsoft/vcpkg/master/ports/${Package}/vcpkg.json"
                } catch {
                  if ($retrycount -ge 5) {
                    throw
                  }
                  $retrycount++
                  Start-Sleep $retrycount
                }
              }
            }
            return $req
          }
          Write-Host "::group::Fetching CONTROL from raw.githubusercontent.com"
          (fetchmeta "gtest").Content > ${{github.workspace}}/.vcpkgvers
          (fetchmeta "openssl").Content >> ${{github.workspace}}/.vcpkgvers
          (fetchmeta "curl").Content >> ${{github.workspace}}/.vcpkgvers
          (fetchmeta "zlib").Content >> ${{github.workspace}}/.vcpkgvers
          Write-Host "::endgroup::"
          Write-Host "::group::Show now vers"
          Get-Content ${{github.workspace}}/.vcpkgvers
          Write-Host "::endgroup::"

      - name: Restore vcpkg cache
        uses: actions/cache/restore@v6
        id: restore-cache
        with:
          path: |
            C:\vcpkg\packages\gtest_x64-windows
            C:\vcpkg\packages\openssl_x64-windows
            C:\vcpkg\packages\curl_x64-windows
            C:\vcpkg\packages\zlib_x64-windows
            C:\vcpkg\installed\*
            #C:\vcpkg\buildtrees\openssl
            #C:\vcpkg\buildtrees\curl
            #C:\vcpkg\buildtrees\gtest
            #C:\vcpkg\buildtrees\detect_compiler
            C:\vcpkg\downloads\*
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ matrix.os }}-vcpkg

      - name: Install vcpkg dependencies
        shell: cmd
        run: |
          vcpkg install gtest:x64-windows && ^
          vcpkg install openssl:x64-windows && ^
          vcpkg install curl[core,non-http,ssl]:x64-windows

      - name: Save vcpkg cache
        uses: actions/cache/save@v6
        id: save-cache
        with:
          path: |
            C:\vcpkg\packages\gtest_x64-windows
            C:\vcpkg\packages\openssl_x64-windows
            C:\vcpkg\packages\curl_x64-windows
            C:\vcpkg\packages\zlib_x64-windows
            C:\vcpkg\installed\*
            #C:\vcpkg\buildtrees\openssl
            #C:\vcpkg\buildtrees\curl
            #C:\vcpkg\buildtrees\gtest
            #C:\vcpkg\buildtrees\detect_compiler
            C:\vcpkg\downloads\*
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
          key: ${{ matrix.os }}-vcpkg

      - name: Checkout libcat sources
        uses: actions/checkout@v7

      - name: Prepare coverage dependencies
        if: matrix.build-type == 'Debug'
        shell: powershell
        run: |
          $headers = @{
            "accept"="application/vnd.github.v3+json";
            "content-type"="application/json";
            "authorization"="Bearer ${{github.token}}";
          }
          # get latest OpenCppCoverage download path
          Write-Host "Fetching latest OpenCppCoverage download path"
          $info = Invoke-WebRequest `
            -UseBasicParsing `
            -Headers $headers `
            -Uri https://api.github.com/repos/OpenCppCoverage/OpenCppCoverage/releases/latest `
              | ConvertFrom-Json
          foreach ($x in $info.assets) {
            if($x.name.EndsWith('.exe')) {
              Write-Host "Downloading latest OpenCppCoverage"
              $uri = $x.browser_download_url
              Invoke-WebRequest -Uri $uri -OutFile OpenCppCoverage.exe -Headers $headers -UseBasicParsing
              break
            }
          }
          # install OpenCppCoverage
          Write-Host "Installing OpenCppCoverage"
          & .\OpenCppCoverage.exe /SP- /NORESTART /VERYSILENT /DIR=C:\OpenCppCoverage

      - name: Build and test libcat
        shell: cmd
        run: |
          @ECHO OFF
          ECHO ::group::Start MSVC environment
          FOR /F "USEBACKQ DELIMS=" %%i in (`vswhere.exe -prerelease -latest -property installationPath`) do (
            IF EXIST "%%i\VC\Auxiliary\Build\vcvars64.bat" (
              CALL "%%i\VC\Auxiliary\Build\vcvars64.bat"
            ) ELSE ( EXIT /B 1 )
          )
          ECHO ::endgroup::
          ECHO ::group::Create build dir
          MKDIR build || goto error
          ECHO ::endgroup::
          ECHO ::group::Make cmake cache
          cmake . -B build ^
            -DLIBCAT_ENABLE_ASAN=ON ^
            -DLIBCAT_ENABLE_DEBUG_LOG=OFF ^
            -DCMAKE_C_FLAGS="/WX" ^
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake || goto error
          ECHO ::endgroup::
          ECHO ::group::Build libcat
          cmake --build build -j --target cat_tests -- -nologo -p:Configuration=${{ matrix.build-type }} || goto error
          ECHO ::endgroup::
          ECHO ::group::Test libcat
          REM note: 颜色是不可能有颜色的，只能等gtest做这个功能或者githubactions支持那两个WIN32API
          REM note: ^ yet impossible to add color, we can only wait for github actions support SetConsoleAttribute or gtest support unix color on windows
          SET ASAN_OPTIONS=log_path=asan.log
          IF "Debug" == "${{ matrix.build-type }}" ( "C:\OpenCppCoverage\OpenCppCoverage.exe" ^
            --export_type cobertura:coverage.xml ^
            --sources include ^
            --sources src ^
            --excluded_sources deps ^
            --excluded_sources tests ^
            --cover_children ^
            --excluded_line_regex "\s*else.*" ^
            --excluded_line_regex "\s*\}.*" ^
            --excluded_line_regex "\s*\{\s*" ^
            --modules build\Debug\cat_tests.exe -- ^
            build\Debug\cat_tests.exe --gtest_color=yes || goto error ) ELSE (build\Release\cat_tests.exe --gtest_color=yes || goto error)
          ECHO ASan log:
          TYPE asan.log* || REM
          ECHO ::endgroup::
          EXIT /b 0
          REM error condition
          :error
          SET test_exit_code=%errorlevel%
          ECHO ASan log:
          IF EXIST asan.log* TYPE asan.log*
          ECHO ::error::Test failed
          EXIT /b %test_exit_code%

      - name: Upload coverage report
        if: matrix.build-type == 'Debug'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Save coverage report
        if: always() && matrix.build-type == 'Debug' && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.build-type }}
          path: coverage.xml
          if-no-files-found: error

  unix-tests:
    name: Test on ${{matrix.os}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        # should use latest, strange that gh still use 18.04 for libcat/libcat
        os: [ "ubuntu-latest", "ubuntu-22.04", "macos-latest" ]
        # os: [ "ubuntu-latest"]
        # os: [ "macos-latest"]
      max-parallel: 2
      fail-fast: false
    steps:
      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{runner.os}}" = "Linux" ]
          then
            export DEBIAN_FRONTEND=noninteractive
            sudo apt-get update
            sudo apt-get install -yyq libgtest-dev libcurl4-openssl-dev libpq-dev
          else
            brew install pkg-config
            brew install openssl@3
            brew install curl
            brew install libpq
          fi

      - name: Checkout libcat sources
        uses: actions/checkout@v7
        with:
          path: libcat

      - name: Checkout GoogleTest sources
        if: runner.os == 'macOS'
        uses: actions/checkout@v7
        with:
          repository: google/googletest
          ref: v1.18.0
          path: googletest

      - name: Build GoogleTest with AddressSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # libc++ container annotations must agree with the instrumented tests.
          cmake -S googletest -B googletest/build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DBUILD_GMOCK=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/googletest"
          cmake --build googletest/build -j
          cmake --install googletest/build

      - name: Start service containers
        shell: bash
        if: runner.os == 'Linux'
        working-directory: libcat
        run: |
          docker compose -f ${{github.workspace}}/libcat/.github/docker-compose.yml up -d

      - name: Build libcat and Run tests
        shell: bash
        working-directory: libcat
        run: |
          cmake_options=()
          if [ "${{ runner.os }}" = "macOS" ]; then
            openssl_prefix=$(brew --prefix openssl@3)
            curl_prefix=$(brew --prefix curl)
            libpq_prefix=$(brew --prefix libpq)
            export OPENSSL_ROOT_DIR="$openssl_prefix"
            export CMAKE_PREFIX_PATH="$RUNNER_TEMP/googletest:$openssl_prefix:$curl_prefix:$libpq_prefix${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
            export PKG_CONFIG_PATH="$openssl_prefix/lib/pkgconfig:$curl_prefix/lib/pkgconfig:$libpq_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
            cmake_options+=(-DLIBCAT_ENABLE_OPENSSL=ON -DLIBCAT_ENABLE_CURL=ON)
          fi
          ${{ runner.os == 'Linux' && 'export TEST_CAT_POSTGRESQL="true"' || '' }}
          echo "::group::Create build dir"
          mkdir -p build && cd build || exit 1
          echo "::endgroup::"
          echo "::group::Make cmake cache"
          cmake .. \
            "${cmake_options[@]}" \
            -DLIBCAT_ENABLE_ASAN=ON \
            -DCODE_COVERAGE=ON \
            -DCMAKE_C_FLAGS="-Werror" || exit 1
          echo "::endgroup::"
          echo "::group::Build libcat"
          cmake --build . -j --target cat_tests || exit 1
          echo "::endgroup::"
          echo "::group::Test libcat"
          exit_status=0
          ASAN_OPTIONS=log_path=asan.log ./cat_tests --gtest_color=yes || exit_status=$?
          if [ "$exit_status" -eq 0 ]; then
            CAT_DEBUG=3 ASAN_OPTIONS=log_path=asan.log ./cat_tests --gtest_color=yes > test-debug.log 2>&1 || exit_status=$?
            tail -n 40 test-debug.log
          fi
          echo "ASan log:"
          cat asan.log* || :
          if [ "$exit_status" -ne 0 ]; then
            echo "::error::Test failed"
            exit $exit_status
          else
            echo "::endgroup::"
          fi

      - name: Coverage tests
        working-directory: libcat
        shell: bash
        run: |
          set -xe
          # note: lcov --keep-going option only available on macOS
          ${{ runner.os == 'macOS' && 'brew install lcov' || 'sudo apt-get install lcov' }}
          ${{ runner.os == 'macOS' && 'export LCOV_CAPTURE_EXT_ARGS="--keep-going"' || 'export LCOV_CAPTURE_EXT_ARGS=""' }}
          lcov_ignore_errors=()
          lcov_version=$(lcov --version | awk '{print $NF}')
          # LCOV 1.x does not recognize the error classes used by newer releases.
          if [ "${lcov_version%%.*}" -ge 2 ]; then
            lcov_ignore_errors=(--ignore-errors inconsistent,format,mismatch)
          fi
          lcov \
            --capture \
            $LCOV_CAPTURE_EXT_ARGS \
            "${lcov_ignore_errors[@]}" \
            --directory "." \
            --output-file coverage.info &&
          lcov \
            --extract coverage.info \
              "${{github.workspace}}/libcat/include/*" \
              "${{github.workspace}}/libcat/src/*" \
            "${lcov_ignore_errors[@]}" \
            --output-file coverage.info &&
          lcov --list coverage.info

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          working-directory: libcat
          files: coverage.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true

      - name: Save coverage report
        if: always() && hashFiles('libcat/coverage.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: libcat/coverage.info
          if-no-files-found: error

      - name: Save debug test logs
        if: always() && hashFiles('libcat/build/test-debug.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          path: |
            libcat/build/test-debug.log
            libcat/build/asan.log*
